<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>수현이의 공부 친구 · 용감한 사냥꾼</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

  :root {
    --bg: #FBF5EC;
    --surface: #FFFFFF;
    --ink: #5A3A28;          /* 먹빛 갈색 — 헤더 */
    --seal: #C23B2E;         /* 도장 빨강 — 강조 */
    --seal-dark: #9E2B20;
    --ochre: #D9A25B;        /* 황토 */
    --sky: #7BBFEA;
    --text-main: #2D2D2D;
    --text-sub: #6B6B6B;
    --bubble-user: #E8F4FF;
    --bubble-ai: #FFF6EA;
    --story-bg: #F6E7CF;
    --peanut: #E9C48A;
    --peanut-bg: #FFF4DF;
    --cookie: #A8744A;
    --cookie-bg: #F7EADF;
    --border: #E6D5C0;
    --shadow: 0 2px 12px rgba(0,0,0,0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { background: var(--bg); }

  body {
    font-family: 'Noto Sans KR', sans-serif;
    color: var(--text-main);
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  header {
    background: var(--ink);
    padding: 12px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    box-shadow: 0 2px 8px rgba(90,58,40,0.3);
  }

  .header-left { display: flex; align-items: center; gap: 10px; }

  .seal-icon {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 8px;
    background: var(--seal);
    color: #fff;
    font-family: 'Gaegu', cursive;
    font-weight: 700;
    font-size: 15px;
    line-height: 1;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
    border: 2px solid rgba(255,255,255,0.5);
  }

  .header-title {
    font-family: 'Gaegu', cursive;
    font-size: 20px;
    font-weight: 700;
    color: white;
    line-height: 1.2;
  }

  .header-sub { font-size: 11px; color: rgba(255,255,255,0.85); font-weight: 400; }

  .timer {
    background: rgba(255,255,255,0.18);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 15px;
    font-weight: 700;
    color: white;
    font-variant-numeric: tabular-nums;
    letter-spacing: 1px;
  }
  .timer.warning { background: rgba(245,200,66,0.45); }
  .timer.overtime { background: rgba(194,59,46,0.8); animation: pulse 1s infinite; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    -webkit-overflow-scrolling: touch;
  }

  .chat-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .date-divider { text-align: center; font-size: 12px; color: var(--text-sub); margin: 4px 0; }

  .msg { display: flex; align-items: flex-end; gap: 8px; max-width: 88%; animation: fadeUp 0.25s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .msg.ai, .msg.char { align-self: flex-start; flex-direction: row; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.story { align-self: stretch; max-width: 100%; }

  .avatar {
    width: 34px; height: 34px;
    border-radius: 50%;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    background: var(--ochre);
    box-shadow: 0 2px 6px rgba(90,58,40,0.25);
  }
  .avatar.peanut { background: var(--peanut); }
  .avatar.cookie { background: var(--cookie); }

  .bubble-wrap { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .name-tag { font-size: 12px; font-weight: 700; color: var(--text-sub); padding-left: 6px; }

  .bubble {
    padding: 11px 15px;
    border-radius: 18px;
    font-size: 16px;
    line-height: 1.65;
    box-shadow: var(--shadow);
    white-space: pre-wrap;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .msg.ai .bubble { background: var(--bubble-ai); border-bottom-left-radius: 4px; border: 1px solid var(--border); }
  .msg.user .bubble { background: var(--bubble-user); border-bottom-right-radius: 4px; border: 1px solid #C8DDEF; color: #1a4a6e; }
  .msg.char.peanut .bubble { background: var(--peanut-bg); border: 1.5px solid var(--peanut); border-bottom-left-radius: 4px; }
  .msg.char.cookie .bubble { background: var(--cookie-bg); border: 1.5px solid var(--cookie); border-bottom-left-radius: 4px; }

  /* 이야기 카드 — 튜터가 장면을 들려줄 때 */
  .story-card {
    width: 100%;
    background: var(--story-bg);
    border: 1px solid var(--border);
    border-left: 5px solid var(--seal);
    border-radius: 14px;
    padding: 14px 18px 16px;
    box-shadow: var(--shadow);
    position: relative;
  }
  .story-card .story-label {
    font-size: 12px; font-weight: 700; color: var(--seal-dark);
    margin-bottom: 6px; letter-spacing: 0.5px;
  }
  .story-card .story-text {
    font-family: 'Gaegu', cursive;
    font-size: 20px;
    line-height: 1.7;
    color: #3B2A1E;
    white-space: pre-wrap;
    word-break: keep-all;
    overflow-wrap: anywhere;
  }

  .typing-dots { display: flex; gap: 4px; padding: 4px 2px; align-items: center; }
  .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--seal); animation: bounce 1.2s infinite; opacity: 0.6; }
  .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
  .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  #api-panel {
    background: white;
    border-top: 2px solid var(--border);
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    flex-shrink: 0;
  }
  #api-panel h3 { font-size: 15px; color: var(--text-main); font-weight: 700; }
  #api-panel p { font-size: 13px; color: var(--text-sub); line-height: 1.5; }
  .api-row { display: flex; gap: 8px; }

  #api-key-input {
    flex: 1;
    min-width: 0;
    padding: 10px 14px;
    border: 1.5px solid var(--border);
    border-radius: 12px;
    font-size: 16px;
    font-family: inherit;
    outline: none;
    background: var(--bg);
  }
  #api-key-input:focus { border-color: var(--seal); }

  #api-save-btn {
    padding: 10px 18px;
    background: var(--seal);
    color: white;
    border: none;
    border-radius: 12px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    white-space: nowrap;
    font-family: inherit;
  }

  #input-area {
    background: var(--surface);
    border-top: 1.5px solid var(--border);
    padding: 10px 12px;
    padding-bottom: calc(10px + env(safe-area-inset-bottom));
    flex-shrink: 0;
  }
  .input-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }

  #user-input {
    flex: 1;
    min-width: 0;
    border: 1.5px solid var(--border);
    border-radius: 22px;
    padding: 10px 16px;
    font-size: 16px;
    font-family: inherit;
    resize: none;
    max-height: 140px;
    outline: none;
    background: var(--bg);
    line-height: 1.5;
    color: var(--text-main);
  }
  #user-input:focus { border-color: var(--sky); }

  #send-btn {
    width: 46px; height: 46px;
    border-radius: 50%;
    border: none;
    background: var(--seal);
    color: white;
    font-size: 20px;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.2s, transform 0.1s;
    box-shadow: 0 2px 8px rgba(194,59,46,0.35);
  }
  #send-btn:disabled { background: #ccc; box-shadow: none; }
  #send-btn:not(:disabled):active { transform: scale(0.93); }
</style>
</head>
<body>

<header>
  <div class="header-left">
    <div class="seal-icon">용감</div>
    <div>
      <div class="header-title">수현이의 공부 친구</div>
      <div class="header-sub" id="story-label">용감한 사냥꾼 🏹</div>
    </div>
  </div>
  <div class="timer" id="timer">00:00</div>
</header>

<div id="chat">
  <div class="chat-inner" id="chat-inner">
    <div class="date-divider" id="date-label"></div>
  </div>
</div>

<div id="api-panel">
  <h3>🔑 시작하기 전에</h3>
  <p>Anthropic API 키를 입력하면 바로 수현이 튜터가 시작돼요.<br>한 번 입력하면 다음에도 기억해요.</p>
  <div class="api-row">
    <input type="password" id="api-key-input" placeholder="sk-ant-..." autocomplete="off" autocorrect="off" spellcheck="false"/>
    <button id="api-save-btn">시작!</button>
  </div>
</div>

<div id="input-area" style="display:none;">
  <div class="input-inner">
    <textarea id="user-input" placeholder="수현이 생각을 여기에 써 줘!" rows="1"></textarea>
    <button id="send-btn" title="보내기">➤</button>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════
// localStorage 안전 래퍼 — 프라이빗 브라우징 등에서 접근이 막혀도
// 스크립트 전체가 멈추지 않도록 방어. 실패하면 메모리에만 저장.
// ══════════════════════════════════════════════════════
var memoryStore = {};
var safeStorage = {
  getItem: function (key) {
    try { return localStorage.getItem(key); }
    catch (e) { return (key in memoryStore) ? memoryStore[key] : null; }
  },
  setItem: function (key, value) {
    try { localStorage.setItem(key, value); }
    catch (e) { memoryStore[key] = value; }
  },
  removeItem: function (key) {
    try { localStorage.removeItem(key); } catch (e) {}
    delete memoryStore[key];
  }
};

// ══════════════════════════════════════════════════════
// ✏️ 요즘 근황 — 세션마다 여기만 바꾸면 인사말 주제가 바뀝니다
// ══════════════════════════════════════════════════════
var CHECKIN_TOPICS = [
  '수현이가 최근에 에버랜드에 다녀왔어. 어땠는지, 뭐가 제일 재밌었는지 물어봐.',
  '수현이가 곧 친구들이랑 같이 놀러 갈 예정이야. 어디 가는지, 지금 기분이 어떤지(설렘, 걱정 등) 물어봐.'
];

// ══════════════════════════════════════════════════════
// 이야기 — 「용감한 사냥꾼」 장면 요약
// 책 문장을 그대로 옮기지 않고 장면별 줄거리만 정리했어요.
// 튜터는 이 요약을 바탕으로 자기 말로 들려줍니다.
// ══════════════════════════════════════════════════════
var STORY = {
  title: '용감한 사냥꾼',
  scenes: [
    {
      name: '장면 1 · 가뭄이 든 마을',
      summary: '아주 먼 옛날 중국의 한 마을에 하이리부라는 사냥꾼이 살았다. 산짐승도 물고기도 잘 잡는 솜씨 좋은 사냥꾼이었고, 잡은 것을 늘 마을 사람들과 나눠 먹었다. 그런데 어느 해 끔찍한 가뭄이 들었다. 곡식과 채소가 말라 죽고 마실 물마저 모자랐다. 골목에서 아이들 웃음소리가 사라지고, 노인들은 기운이 없어 일어나지도 못했다. 배고픈 마을 사람들은 서로 탓하고 미워하며 툭하면 싸웠다.',
      pause: '[선택] "사람들이 배가 고프니까 왜 서로 싸우게 됐을까?" → 심화: "수현이도 배고프거나 피곤할 때 마음이 달라진 적 있어?"'
    },
    {
      name: '장면 2 · 뱀과 두루미',
      summary: '하이리부는 사냥감을 찾아 깊은 산속으로 들어갔다. 바위 위에서 길고 가느다란 뱀이 똬리를 틀고 햇볕을 쬐고 있어서, 방해하지 않으려고 살금살금 지나가려 했다. 바로 그때 구름 속에서 두루미가 나타나 뱀을 휙 낚아채 하늘로 날아올랐다. 그런데 뱀이 사람 말로 "살려 주세요!" 하고 외쳤다.',
      pause: '[추천] "수현이가 하이리부라면 이 순간 어떻게 할 것 같아?" → 심화: "근데 두루미도 배가 고파서 사냥한 걸 수도 있잖아. 그래도 뱀을 구하는 게 맞을까?" (정답 없음. 양쪽을 생각해 보는 연습 — 마지막 토론의 예고편)'
    },
    {
      name: '장면 3 · 구해 준 뱀의 정체',
      summary: '하이리부는 재빨리 활을 쏘았다. 화살은 두루미를 아슬아슬하게 스쳐 지나갔고, 깜짝 놀란 두루미가 비명을 지르느라 뱀을 떨어뜨렸다. 뱀은 풀숲으로 사라져 아무리 찾아도 보이지 않았다. 다음 날 하이리부가 다시 산에 가자 그 뱀이 나타나 공손히 고개를 숙였다. 사실 자기는 바다 용왕의 딸이라며, 목숨을 구해 준 은혜를 갚고 싶으니 용궁에 같이 가 달라고 했다. 사냥을 해야 해서 망설였지만 부탁을 거절하지 못한 하이리부는 산길을 내려가 바닷속 용궁으로 향했다.',
      pause: '[선택] "화살이 두루미를 맞히지 않고 스쳐 지나갔어. 우연이었을까, 일부러였을까? 왜 그렇게 생각해?"'
    },
    {
      name: '장면 4 · 용왕의 선물',
      summary: '용궁에 도착하자 용왕이 반갑게 맞으며 딸을 구해 줘서 고맙다고, 선물을 하나 주고 싶다고 했다. 하이리부는 곰곰 생각했다. 굶주리는 마을 사람들에게 도움이 되는 것을 받고 싶었다. 용왕은 빨갛게 빛나는 루비, 초록빛 에메랄드, 파랗게 빛나는 사파이어 같은 귀한 보물들을 꺼내 놓고 갖고 싶은 것을 말해 보라고 했다.',
      pause: '[핵심 · 예측] 하이리부의 선택을 말하기 전에 멈춰: "하이리부는 뭘 달라고 했을 것 같아?" → 이유 → "수현이라면 뭘 골랐을 것 같아? 왜?" 수현이 생각을 충분히 들은 다음에 장면 5로.'
    },
    {
      name: '장면 5 · 구슬과 비밀',
      summary: '하이리부는 보물은 먹고사는 데 도움이 되지 않는다며, 동물들의 말을 알아듣는 능력을 갖고 싶다고 했다. 그러면 사냥을 더 잘해서 마을 사람들의 배고픔을 덜어 줄 수 있으니까. 용왕은 말없이 고개를 끄덕이고, 입에 물고 있던 커다란 구슬을 건네주었다. 이 구슬이 소원을 들어줄 거라고 하면서 한 가지를 당부했다. 용궁에서 있었던 일은 비밀로 해야 하며, 누구에게든 이 비밀을 말하는 순간 돌이 되어 버린다고.',
      pause: '[핵심 · 심화] 수현이 예측과 비교해 준 뒤: "보물을 팔아서 먹을 걸 사도 되잖아. 하이리부는 왜 보물 말고 그 능력을 골랐을까?" → 이유의 이유, 가정 바꾸기로 1~2번 더. [선택] "용왕은 왜 비밀을 지키라는 조건을 붙였을까?"'
    },
    {
      name: '장면 6 · 다시 웃음을 찾은 마을',
      summary: '구슬을 품고 돌아온 하이리부는 이제 동물 말을 알아들었다. 작은 새들이 지저귀는 소리로 산양과 멧돼지가 있는 곳을 알아냈고, 갈매기 소리를 듣고 물고기와 조개가 많은 바다를 찾아냈다. 푸짐하게 잡은 것을 아이들과 노인들, 마을 사람 모두에게 골고루 나눠 주었다. 아이들은 다시 통통하게 살이 올랐고, 골목마다 이야기 소리와 웃음소리가 가득해졌다.',
      pause: '[선택 · 짧게] "장면 1의 마을이랑 지금 마을, 뭐가 달라졌어?"'
    },
    {
      name: '장면 7 · 동물들의 경고',
      summary: '그러던 어느 새벽, 숲속 동물들이 불안하게 웅성거렸다. 곧 무시무시한 천둥 번개가 치고 엄청난 비가 쏟아져서 마을이 물에 잠길 거라고, 산이 무너질지도 모르는데 사람들은 아무것도 모른다고. 이 말을 모두 들은 하이리부는 너무 놀라 활까지 떨어뜨리고 허둥지둥 마을로 달려갔다.',
      pause: '[선택 · 짧은 예측] "하이리부가 말하면 마을 사람들이 믿어 줄까?"'
    },
    {
      name: '장면 8 · 믿어 주지 않는 사람들',

'   (네가 힌트를 줄 때만 참고하고, 먼저 말하지 마: 하이리부의 목숨도 똑같이 소중함 / 살아 있었다면 앞으로 더 많은 사람을 도울 수 있었음 / 하이리부를 아끼는 사람들이 슬퍼함 / 용왕과의 약속을 어김 / 마을 사람들도 스스로 판단할 책임이 있었음 / 비밀을 말하지 않고도 믿게 할 다른 방법이 있었을 수도 있음 — 동물들 행동을 직접 보여 주기, 믿는 사람 몇 명과 아이들부터 먼저 피하기 등)\n' +
'(3) 저울질: "양쪽 이유 중에 수현이 마음에 제일 무겁게 느껴지는 건 뭐야? 왜?"\n' +
'(4) 수현이라면: "수현이가 하이리부라면 어떤 선택을 했을 것 같아? 이유도 말해 줘." 어떤 선택이든 존중해. 그다음 가정 바꾸기로 한 번 흔들어 봐. (비밀을 말하겠다면 → "만약 비밀을 말했는데도 사람들이 안 믿었다면?" / 도망이나 다른 방법이라면 → "그 방법이 실패하면 어떻게 할 거야?") 마지막에 "이런 선택엔 정답이 없어. 수현이가 이유를 끝까지 생각해 본 게 제일 멋진 거야"라고 정리해.\n' +
'- 주의: 자기를 희생하는 게 무조건 옳다고 가르치지 마. 수현이가 이 이야기를 현실에 적용해서 "나도 친구를 위해 위험한 걸 할래" 같은 말을 하면, 따뜻하게 받아 주고 "진짜 위험한 상황이면 어린이는 먼저 자기를 지키고 어른한테 빨리 알리는 게 가장 용감한 행동이야"라고 한 번만 짧게 말해 줘. 설교는 하지 마.\n\n' +

'### 5단계: 역할극 — 수현이는 하이리부, 땅콩이랑 쿠키는 동물 친구 (8~12번 주고받기)\n\n' +
'(1) 준비: "이번엔 수현이가 하이리부가 되어 보는 거야. 용왕의 구슬을 가진 수현이한테는 동물 친구들 말이 다 들려!" 그리고 수현이의 동물 친구 땅콩이와 쿠키에 대해 물어봐. 너는 이름만 알고 자세히는 몰라. "땅콩이랑 쿠키는 어떤 동물이야?" → "성격은 어때?" 를 한 번에 하나씩. 수현이가 말해 준 동물 종류, 성격, 말투를 역할극에 그대로 살려.\n' +
'(2) 장면 열기: 재앙이 오기 전날 새벽, 땅콩이와 쿠키가 하이리부(수현이)에게 달려와 이상한 걸 느꼈다고 말하는 장면으로 시작해. 네가 짧게 상황을 깔아 주고 바로 [땅콩이], [쿠키] 대사로 들어가.\n' +
'(3) 진행 규칙:\n' +
'   - 한 번에 땅콩이와 쿠키가 각각 1~2문장씩만 말하고, 끝은 꼭 하이리부(수현이)에게 묻는 말로 끝내. 수현이가 대사를 할 차례를 계속 만들어 줘.\n' +
'   - 두 친구의 성격을 확실히 다르게 (예: 하나는 겁 많고 걱정 많은, 하나는 씩씩하고 엉뚱한 — 단 수현이가 말해 준 성격이 있으면 그걸 따라).\n' +
'   - 상상력을 자극하는 질문을 섞어: 동물들은 어떻게 재앙을 먼저 알았을지(냄새, 땅의 떨림, 바람, 소리), 사람들을 어떻게 설득할지, 땅콩이와 쿠키가 어떤 역할을 맡을지.\n' +
'   - 핵심 도전: "이번엔 비밀을 말하지 않고도 마을 사람들이 믿게 만들 방법"을 셋이 같이 작전 짜 보기. 아까 토론에서 수현이가 말한 생각을 여기서 다시 꺼내 줘.\n' +
'   - 수현이가 이야기를 바꾸고 싶어 하면 적극 따라가. 이제 이건 수현이의 이야기야. 수현이 아이디어가 조금 엉뚱해도 땅콩이와 쿠키가 신나게 받아 줘.\n' +
'(4) 역할극 마무리: 8~12번 주고받거나 시간이 되면, [이야기] 형식으로 수현이가 만든 결말을 2~3문장으로 정리해 들려줘. 그다음 친구로 돌아와서 "하이리부가 되어 보니까 어땠어?" 한 번 물어봐.\n\n' +

'### 6단계: 마무리 (3~4턴)\n\n' +
'먼저 오늘 수현이 답변 중 진짜 흥미로웠던 것 1~2가지를 실제 말을 인용해서 짚어 줘: "오늘 수현이가 ~라고 했을 때 진짜 놀랐어. 왜냐면 ~."\n' +
'그다음: "수현이는 오늘 어떤 부분이 제일 재밌었어? 어렵거나 별로였던 부분은?"\n' +
'마지막 인사에서 근황 이야기를 다시 꺼내 줘. 예를 들어 친구들이랑 놀러 가는 거 재밌게 다녀오라고, 다녀와서 얘기해 달라고. 그리고 "오늘도 같이 생각해 줘서 고마워. 안녕 수현아!"\n\n' +

'## 수현이에 대해\n\n' +
'- 자기 감정을 알아주길 바라는 마음이 커. 감정 표현에 충분히 반응해 줘.\n' +
'- 어떤 답을 해도 먼저 받아 주고, 그다음에 질문으로 이어 가.\n' +
'- 타이핑이 느릴 수 있어. 답이 짧아도 재촉하지 마.';
}

var SYSTEM_PROMPT = buildSystemPrompt(STORY);

// ══════════════════════════════════════════════════════
// 상태 & DOM
// ══════════════════════════════════════════════════════
var MODEL = 'claude-sonnet-4-6';
var apiKey = safeStorage.getItem('suhyeon_api_key') || '';
var messages = [];
var isLoading = false;
var elapsedSeconds = 0;
var timerHandle = null;

var chat        = document.getElementById('chat');
var chatInner   = document.getElementById('chat-inner');
var inputArea   = document.getElementById('input-area');
var apiPanel    = document.getElementById('api-panel');
var apiKeyInput = document.getElementById('api-key-input');
var apiSaveBtn  = document.getElementById('api-save-btn');
var userInput   = document.getElementById('user-input');
var sendBtn     = document.getElementById('send-btn');
var timerEl     = document.getElementById('timer');
var dateLabel   = document.getElementById('date-label');

dateLabel.textContent = new Date().toLocaleDateString('ko-KR', {
  year: 'numeric', month: 'long', day: 'numeric', weekday: 'short'
});

if (apiKey) showChat();

apiSaveBtn.addEventListener('click', function () {
  var key = apiKeyInput.value.trim();
  if (key.indexOf('sk-ant-') !== 0) { alert('API 키가 올바르지 않아요. sk-ant- 로 시작해야 해요!'); return; }
  apiKey = key;
  safeStorage.setItem('suhyeon_api_key', key);
  showChat();
});
apiKeyInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') apiSaveBtn.click(); });

function showChat() {
  apiPanel.style.display = 'none';
  inputArea.style.display = 'block';
  startTimer();
  if (messages.length === 0) startSession();
}

function showApiPanel(note) {
  apiPanel.style.display = 'flex';
  inputArea.style.display = 'none';
  if (note) apiPanel.querySelector('p').textContent = note;
}

function startTimer() {
  if (timerHandle) return;
  timerHandle = setInterval(function () {
    elapsedSeconds++;
    var m = String(Math.floor(elapsedSeconds / 60)).padStart(2, '0');
    var s = String(elapsedSeconds % 60).padStart(2, '0');
    timerEl.textContent = m + ':' + s;
    timerEl.className = 'timer';
    if (elapsedSeconds >= 1800) timerEl.className = 'timer overtime';
    else if (elapsedSeconds >= 1200) timerEl.className = 'timer warning';
  }, 1000);
}

function scrollToBottom() { chat.scrollTop = chat.scrollHeight; }

// ── 말풍선 만들기 ──
var CHAR_INFO = {
  '땅콩이': { cls: 'peanut', emoji: '🥜' },
  '쿠키':   { cls: 'cookie', emoji: '🍪' }
};

function makeAvatar(emoji, extraCls) {
  var a = document.createElement('div');
  a.className = 'avatar' + (extraCls ? ' ' + extraCls : '');
  a.textContent = emoji;
  return a;
}

function appendUser(text) {
  var msg = document.createElement('div');
  msg.className = 'msg user';
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  chatInner.appendChild(msg);
  scrollToBottom();
  return msg;
}

function appendTutor(text) {
  var msg = document.createElement('div');
  msg.className = 'msg ai';
  msg.appendChild(makeAvatar('🏹'));
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  msg.appendChild(bubble);
  chatInner.appendChild(msg);
}

function appendStory(text) {
  var msg = document.createElement('div');
  msg.className = 'msg story';
  var card = document.createElement('div');
  card.className = 'story-card';
  var label = document.createElement('div');
  label.className = 'story-label';
  label.textContent = '📜 이야기';
  var body = document.createElement('div');
  body.className = 'story-text';
  body.textContent = text;
  card.appendChild(label);
  card.appendChild(body);
  msg.appendChild(card);
  chatInner.appendChild(msg);
}

function appendCharacter(name, text) {
  var info = CHAR_INFO[name];
  var msg = document.createElement('div');
  msg.className = 'msg char ' + info.cls;
  msg.appendChild(makeAvatar(info.emoji, info.cls));
  var wrap = document.createElement('div');
  wrap.className = 'bubble-wrap';
  var tag = document.createElement('div');
  tag.className = 'name-tag';
  tag.textContent = name;
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = text;
  wrap.appendChild(tag);
  wrap.appendChild(bubble);
  msg.appendChild(wrap);
  chatInner.appendChild(msg);
}

// AI 답을 [이야기] / [땅콩이] / [쿠키] 태그 기준으로 나눠서 보여 줌.
// 태그가 붙은 덩어리는 다음 태그나 빈 줄에서 끝남. (iOS 15 호환: lookbehind 미사용)
var TAG_RE = /^\s*\[(이야기|땅콩이|쿠키|나)\]\s*(.*)$/;
var COLON_RE = /^\s*(땅콩이|쿠키)\s*[:：]\s*(.*)$/;

function parseReply(text) {
  var clean = text.replace(/\r/g, '').replace(/\*\*/g, '');
  var lines = clean.split('\n');
  var segments = [];
  var cur = null;
  for (var i = 0; i < lines.length; i++) {
    var line = lines[i];
    var m = line.match(TAG_RE) || line.match(COLON_RE);
    if (m) {
      var type = (m[1] === '나') ? 'tutor' : m[1];
      cur = { type: type, lines: [m[2]] };
      segments.push(cur);
    } else if (line.trim() === '') {
      if (cur && cur.type !== 'tutor') cur = null;
      else if (cur) cur.lines.push('');
    } else {
      if (!cur) { cur = { type: 'tutor', lines: [] }; segments.push(cur); }
      cur.lines.push(line);
    }
  }
  return segments
    .map(function (s) { return { type: s.type, text: s.lines.join('\n').trim() }; })
    .filter(function (s) { return s.text.length > 0; });
}

function renderReply(text) {
  var segs = parseReply(text);
  if (segs.length === 0) segs = [{ type: 'tutor', text: text }];
  segs.forEach(function (s) {
    if (s.type === '이야기') appendStory(s.text);
    else if (CHAR_INFO[s.type]) appendCharacter(s.type, s.text);
    else appendTutor(s.text);
  });
  scrollToBottom();
}

function showTyping() {
  var msg = document.createElement('div');
  msg.className = 'msg ai';
  msg.id = 'typing-indicator';
  msg.appendChild(makeAvatar('🏹'));
  var bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.innerHTML = '<div class="typing-dots"><span></span><span></span><span></span></div>';
  msg.appendChild(bubble);
  chatInner.appendChild(msg);
  scrollToBottom();
}

function removeTyping() {
  var el = document.getElementById('typing-indicator');
  if (el) el.remove();
}

// ══════════════════════════════════════════════════════
// API 호출
// ══════════════════════════════════════════════════════
async function sendToAI(userText, isKickoff) {
  if (isLoading) return;
  isLoading = true;
  sendBtn.disabled = true;

  var minutesElapsed = Math.floor(elapsedSeconds / 60);
  messages.push({ role: 'user', content: '[현재 세션 경과 시간: ' + minutesElapsed + '분]\n' + userText });

  showTyping();

  try {
    var res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true'
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1200,
        system: SYSTEM_PROMPT,
        messages: messages
      })
    });

    var data = await res.json();
    if (data.error) {
      var err = new Error(data.error.message || 'API error');
      err.status = res.status;
      err.type = data.error.type;
      throw err;
    }

    var reply = (data.content || [])
      .filter(function (b) { return b.type === 'text'; })
      .map(function (b) { return b.text; })
      .join('\n');
    messages.push({ role: 'assistant', content: reply });

    removeTyping();
    renderReply(reply);

  } catch (err) {
    removeTyping();
    // 실패한 수현이 말은 기록에서 빼고 입력창에 되돌려서 다시 보낼 수 있게
    messages.pop();
    if (err.status === 401 || err.type === 'authentication_error') {
      safeStorage.removeItem('suhyeon_api_key');
      apiKey = '';
      showApiPanel('API 키가 맞지 않는 것 같아요. 다시 입력해 주세요.');
    } else {
      if (!isKickoff) {
        if (lastUserBubble) lastUserBubble.remove();
        userInput.value = userText;
      }
      appendTutor('앗, 연결이 잠깐 끊겼어. 보내기 버튼을 한 번 더 눌러 줄래?');
      scrollToBottom();
    }
    if (isKickoff) pendingKickoff = true;
    console.error(err);
  }

  isLoading = false;
  sendBtn.disabled = false;
}

var KICKOFF_TEXT = '안녕! 지금 막 접속했어. 오늘 수업 시작해 줘.';
var pendingKickoff = false;
var lastUserBubble = null;

function startSession() {
  sendToAI(KICKOFF_TEXT, true);
}

function handleSend() {
  if (isLoading) return;
  if (pendingKickoff && messages.length === 0) {
    pendingKickoff = false;
    startSession();
    return;
  }
  var text = userInput.value.trim();
  if (!text) return;
  lastUserBubble = appendUser(text);
  userInput.value = '';
  userInput.style.height = 'auto';
  sendToAI(text, false);
}

sendBtn.addEventListener('click', handleSend);
userInput.addEventListener('keydown', function (e) {
  // 한글 조합 중 Enter는 무시 (마지막 글자 중복 방지)
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(); }
});
userInput.addEventListener('input', function () {
  userInput.style.height = 'auto';
  userInput.style.height = Math.min(userInput.scrollHeight, 140) + 'px';
});
</script>
